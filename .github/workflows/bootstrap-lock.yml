name: Batch A bootstrap

on:
  push:
    branches:
      - batch-a/foundation-init

permissions:
  contents: write

jobs:
  validate-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12
        shell: pwsh

      - name: Generate lockfile
        run: uv lock --python 3.12
        shell: pwsh

      - name: Synchronize environment
        run: uv sync --all-groups --python 3.12
        shell: pwsh

      - name: Run tests
        run: uv run pytest
        shell: pwsh

      - name: Run lint
        run: uv run ruff check .
        shell: pwsh

      - name: Check formatting
        run: uv run ruff format --check .
        shell: pwsh

      - name: Run type checks
        run: uv run mypy src
        shell: pwsh

      - name: Commit generated lockfile
        shell: pwsh
        run: |
          $status = git status --porcelain -- uv.lock
          if ($status) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: add uv lockfile"
            git push
          }
