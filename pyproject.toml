[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stl-analyzer"
version = "0.1.0"
description = "Deterministic local CLI for agent-driven dental STL inspection and rendering workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "STL Analyzer contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "typer>=0.16,<1",
]

[project.scripts]
stl-analyzer = "stl_analyzer.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stl_analyzer"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=stl_analyzer --cov-report=term-missing"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.coverage.run]
branch = true
source = ["stl_analyzer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stl_analyzer"]
warn_unreachable = true

[tool.uv]
default-groups = ["dev"]
